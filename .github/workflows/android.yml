name: BitChord Beta Release APK

on:
  workflow_dispatch:

jobs:
  build-beta-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Configure signing
        env:
          RELEASE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          printf 'LASTFM_API_KEY=%s\nLASTFM_SECRET=%s\nLISTEN_TOGETHER_SERVER=%s\n' \
            "$LASTFM_API_KEY" "$LASTFM_SECRET" "$LISTEN_TOGETHER_SERVER" > local.properties
          if [[ -n "$RELEASE_KEYSTORE" && -n "$RELEASE_STORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" ]]; then
            printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > beta-release.jks
          else
            RELEASE_STORE_PASSWORD="$(openssl rand -hex 16)"
            RELEASE_KEY_PASSWORD="$RELEASE_STORE_PASSWORD"
            RELEASE_KEY_ALIAS=beta
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore beta-release.jks \
              -storepass "$RELEASE_STORE_PASSWORD" -keypass "$RELEASE_KEY_PASSWORD" \
              -alias "$RELEASE_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 3650 \
              -dname 'CN=BitChord Beta'
          fi
          printf 'storeFile=beta-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" > keystore.properties
      - name: Build signed release
        run: bash gradlew :app:assembleBetaRelease
      - name: Verify universal APK
        run: |
          apk=$(find app/build/outputs/apk/beta/release -name '*universal*.apk' -print -quit)
          test -n "$apk"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify "$apk"
          package_info=$("$build_tools/aapt" dump badging "$apk")
          grep -F "package: name='com.beta.bitchord'" <<< "$package_info"
          grep -F "application-label:'BitChord Beta'" <<< "$package_info"
          if grep -Eq '^application-debuggable' <<< "$package_info"; then exit 1; fi
          cp "$apk" BitChord-Beta-release.apk
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Beta-release
          path: BitChord-Beta-release.apk
          if-no-files-found: error
